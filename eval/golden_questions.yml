# Golden questions for the reference implementation.
#
# Each entry has:
#   id:           short identifier
#   question:     natural-language question
#   reference_sql: a hand-written SELECT that returns a sensible answer.
#                  Used in --offline mode (no LLM key required) so the eval
#                  always exercises the guard + executor pipeline.
#   must_contain: tokens (case-insensitive) the LLM-generated SQL should
#                  contain when run in --online mode. Loose match; the
#                  grading rubric is "did it touch the right tables/columns
#                  AND return a non-empty result".
#   expect_rows:  one of:
#                   "nonempty"  (default)
#                   "single"    (exactly one row)
#                   {min: N}    (at least N rows)

- id: q01_total_customers
  question: "How many customers do we have in total?"
  reference_sql: "SELECT COUNT(*) AS total_customers FROM customers"
  must_contain: ["customers", "count"]
  expect_rows: "single"

- id: q02_orders_last_30_days
  question: "How many orders were placed in the last 30 days?"
  reference_sql: |
    SELECT COUNT(*) AS recent_orders
    FROM orders
    WHERE created_at >= date('now', '-30 days')
  must_contain: ["orders", "count", "30"]
  expect_rows: "single"

- id: q03_revenue_by_month
  question: "Show monthly revenue from paid and shipped orders over the past year."
  reference_sql: |
    SELECT strftime('%Y-%m', created_at) AS month,
           SUM(total_cents) / 100.0 AS revenue
    FROM orders
    WHERE status IN ('paid','shipped')
      AND created_at >= date('now', '-12 months')
    GROUP BY month
    ORDER BY month
  must_contain: ["orders", "sum", "group by"]
  expect_rows: { min: 3 }

- id: q04_top_products_by_revenue
  question: "What are the top 5 products by total revenue?"
  reference_sql: |
    SELECT p.name,
           SUM(oi.quantity * oi.unit_price_cents) / 100.0 AS revenue
    FROM order_items oi
    JOIN orders o   ON o.id = oi.order_id
    JOIN products p ON p.id = oi.product_id
    WHERE o.status IN ('paid','shipped')
    GROUP BY p.id, p.name
    ORDER BY revenue DESC
    LIMIT 5
  must_contain: ["order_items", "products", "sum", "limit"]
  expect_rows: { min: 1 }

- id: q05_customers_by_tier
  question: "Break down customers by subscription tier."
  reference_sql: |
    SELECT tier, COUNT(*) AS n
    FROM customers
    GROUP BY tier
    ORDER BY n DESC
  must_contain: ["customers", "tier", "group by"]
  expect_rows: { min: 2 }

- id: q06_open_tickets
  question: "How many open support tickets are there right now?"
  reference_sql: |
    SELECT COUNT(*) AS open_tickets
    FROM support_tickets
    WHERE status = 'open'
  must_contain: ["support_tickets", "open"]
  expect_rows: "single"

- id: q07_avg_order_value
  question: "What is the average order value for paid orders?"
  reference_sql: |
    SELECT AVG(total_cents) / 100.0 AS avg_order_value
    FROM orders
    WHERE status = 'paid'
  must_contain: ["orders", "avg", "paid"]
  expect_rows: "single"

- id: q08_revenue_by_country
  question: "Which countries generate the most revenue?"
  reference_sql: |
    SELECT c.country,
           SUM(o.total_cents) / 100.0 AS revenue
    FROM orders o
    JOIN customers c ON c.id = o.customer_id
    WHERE o.status IN ('paid','shipped')
    GROUP BY c.country
    ORDER BY revenue DESC
  must_contain: ["country", "customers", "orders", "sum"]
  expect_rows: { min: 3 }

- id: q09_refund_rate
  question: "What percentage of orders are refunded?"
  reference_sql: |
    SELECT
      ROUND(
        100.0 * SUM(CASE WHEN status='refunded' THEN 1 ELSE 0 END) / COUNT(*),
        2
      ) AS refund_pct
    FROM orders
  must_contain: ["orders", "refunded"]
  expect_rows: "single"

- id: q10_top_customers
  question: "Who are the top 10 customers by lifetime spend?"
  reference_sql: |
    SELECT c.name,
           c.email,
           SUM(o.total_cents) / 100.0 AS lifetime_spend
    FROM customers c
    JOIN orders o ON o.customer_id = c.id
    WHERE o.status IN ('paid','shipped')
    GROUP BY c.id, c.name, c.email
    ORDER BY lifetime_spend DESC
    LIMIT 10
  must_contain: ["customers", "orders", "sum", "limit"]
  expect_rows: { min: 1 }

- id: q11_category_split
  question: "How many products do we sell in each category?"
  reference_sql: |
    SELECT category, COUNT(*) AS n_products
    FROM products
    GROUP BY category
    ORDER BY n_products DESC
  must_contain: ["products", "category", "group by"]
  expect_rows: { min: 2 }

- id: q12_tickets_by_subject
  question: "What are the most common support ticket subjects?"
  reference_sql: |
    SELECT subject, COUNT(*) AS n
    FROM support_tickets
    GROUP BY subject
    ORDER BY n DESC
  must_contain: ["support_tickets", "subject", "group by"]
  expect_rows: { min: 2 }

- id: q13_new_customers_per_month
  question: "How many new customers signed up each month over the past 6 months?"
  reference_sql: |
    SELECT strftime('%Y-%m', created_at) AS month,
           COUNT(*) AS signups
    FROM customers
    WHERE created_at >= date('now', '-6 months')
    GROUP BY month
    ORDER BY month
  must_contain: ["customers", "count", "group by"]
  expect_rows: { min: 1 }

- id: q14_enterprise_revenue
  question: "How much revenue have enterprise-tier customers generated?"
  reference_sql: |
    SELECT SUM(o.total_cents) / 100.0 AS enterprise_revenue
    FROM orders o
    JOIN customers c ON c.id = o.customer_id
    WHERE c.tier = 'enterprise'
      AND o.status IN ('paid','shipped')
  must_contain: ["enterprise", "orders", "customers"]
  expect_rows: "single"

- id: q15_avg_resolution_hours
  question: "On average, how many hours does it take to resolve a support ticket?"
  reference_sql: |
    SELECT AVG(
      (julianday(resolved_at) - julianday(created_at)) * 24.0
    ) AS avg_hours_to_resolve
    FROM support_tickets
    WHERE resolved_at IS NOT NULL
  must_contain: ["support_tickets", "resolved_at"]
  expect_rows: "single"
