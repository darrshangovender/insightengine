[project]
name = "insightengine"
version = "0.1.0"
description = "Reference implementation of an NL-to-SQL analytics layer with sqlglot AST guardrails."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Darrshan Govender", email = "darrshangovender@gmail.com" }]
keywords = ["nl-to-sql", "text-to-sql", "sqlglot", "analytics", "llm", "fastapi"]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "sqlglot>=23.0",
    "anthropic>=0.39",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "faker>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.6",
    # httpx backs starlette's TestClient, which the API tests use.
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/darrshangovender/insightengine"
Issues = "https://github.com/darrshangovender/insightengine/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "demo", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
